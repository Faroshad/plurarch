<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plurarch · phone 390×844</title>
<!-- A phone-sized frame around the real participant page (index.html), for the screen-recorded showcase
     (tools/showcase/record_screen.py). Nothing here changes the page; it only gives it a phone's size. -->
<style>
  :root { --bg: #0B0C0F; --text-2: #A3A6B1; --text-3: #6E7280; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #EDEEF2; font: 500 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  body { display: grid; place-items: center; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .label { color: var(--text-2); letter-spacing: 0.01em; }
  .label b { color: #EDEEF2; font-weight: 600; }
  .phone { width: 414px; height: 868px; border-radius: 54px; background: #000; padding: 12px; box-sizing: border-box;
    box-shadow: 0 0 0 2px #2C2F36, 0 24px 60px rgba(0,0,0,0.6); }
  .screen { width: 390px; height: 844px; border-radius: 42px; overflow: hidden; background: #fff; }
  iframe { width: 390px; height: 844px; border: 0; display: block; }
  .sub { color: var(--text-3); font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label"><b>Participant phone</b> · 390 × 844 · anonymous, no app, no account</div>
    <div class="phone"><div class="screen"><iframe id="phone" src="/index.html" title="Participant page"></iframe></div></div>
    <div class="sub" id="sub">localhost:8790 · the same page phones open from the QR code</div>
  </div>
</body>
</html>
