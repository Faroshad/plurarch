<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="robots" content="noindex">
  <title>Plurarch · stage</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='8' fill='%231A1A1A'/%3E%3Cpath d='M6 13.5L22 8.5M8.5 15.4V21.5M12.5 14.2V21.5M16.5 12.9V21.5M20.5 11.7V21.5' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="stage.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- three.js for the optional 3D view of the applied design (loaded lazily by js/viewer3d.js). -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
      "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.js": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.min.js"
    }
  }
  </script>
  <script src="config.js"></script>
  <script type="module" src="js/stage.js"></script>
</head>
<body class="stage-body">
  <!-- Projector screen: one idea at a time, driven by the session data.
       Keys: Space = open / close round (and "next round" after a decision), F = full screen, Esc = console. -->
  <main id="stage" class="stage" aria-live="polite">
    <section class="screen screen-boot"><p class="boot-text">Loading the stage…</p></section>
  </main>

  <div id="stage-3d" class="stage-3d" aria-hidden="true"></div>

  <div id="conn" class="stage-conn" data-state="reconnecting" role="status" title="Connecting">
    <span class="dot" aria-hidden="true"></span><span class="txt">Connecting</span>
  </div>
  <div id="demo-chip" class="stage-demo" hidden>Demo data</div>

  <nav id="hints" class="stage-hints" aria-label="Stage controls">
    <span id="hint-primary"></span>
    <button id="hint-fs" class="stage-hint-btn" type="button"><kbd>F</kbd> Full screen</button>
    <a id="hint-console" class="stage-hint-btn" href="console.html"><kbd>Esc</kbd> Console</a>
  </nav>

  <div id="toast" class="stage-toast" role="status" aria-live="polite" hidden></div>
  <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
